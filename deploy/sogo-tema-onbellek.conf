# ============================================================
# Resco Mail — TEMA DOSYALARI ICIN ONBELLEK KURALI
#
# SORUN (Bulent 2026-08-22: "logof oluncada eski sogo login geliyor, cache
# belleği temizlemeden ekrandan gitmiyor"):
#   Plesk'in webmail vhost'u SOGo kaynaklarina 1 YIL onbellek veriyor
#   (<Directory /usr/lib/GNUstep/SOGo/> ... ExpiresDefault "access plus 1 year").
#   SOGo kendi dosyalarini "?lm=<zaman>" damgasiyla cagirdigi icin onlar
#   tazelenir; ama bizim tema dosyalarimiz (theme.js, logo, tema css)
#   SOGoUIAdditionalJSFiles ile DAMGASIZ cagriliyor -> tarayici eski surumu
#   tutuyor, cikis sonrasi eski giris ekrani gorunuyor.
#
# COZUM: yalnizca BIZIM tema dosyalarimiz icin "no-cache". Dosya yine
# onbellege alinir ama her kullanimda ETag/Last-Modified ile dogrulanir
# (degismediyse 304 doner — bant genisligi israfi yok).
#
# NOT: Plesk'in urettigi webmail vhost'u ELLE DUZENLENMEZ (Plesk ezer).
# Bu dosya /etc/apache2/conf-enabled/ altina konur; Plesk'e dokunmaz.
# ============================================================

<IfModule mod_headers.c>
  <LocationMatch "^/SOGo(\.woa)?/WebServerResources/(js/theme\.js|css/theme-default\.css|img/sogo-full\.svg)$">
    Header set Cache-Control "no-cache, must-revalidate"
    Header unset Expires
    Header unset Pragma
  </LocationMatch>
</IfModule>
