# Resco Mail Kapi — eposta.rescopos.com icin ek Apache yonergeleri.
# Kaynak: Plesk'in webmail vhost'unda urettigi "#extension sogo" blogunun birebir uyarlamasi
# (fark: kok "/" SOGo'ya yonlendirilmez — orayi Kapi giris ekrani karsilar).
# Kurulum: deploy/kapi-kurulum.sh bunu /var/www/vhosts/system/<alan>/conf/vhost.conf'a yazar.

Alias /SOGo.woa/WebServerResources/ /usr/lib/GNUstep/SOGo/WebServerResources/
Alias /SOGo/WebServerResources/ /usr/lib/GNUstep/SOGo/WebServerResources/

<Directory /usr/lib/GNUstep/SOGo/>
	AllowOverride None
	Require all granted
	<IfModule expires_module>
		ExpiresActive On
		ExpiresDefault "access plus 1 year"
	</IfModule>
</Directory>

Header always set Referrer-Policy "same-origin"

<Location /SOGo>
	Header set Cache-Control "max-age=0, no-cache, no-store"
</Location>

ProxyRequests Off
ProxyPreserveHost On
SetEnv proxy-nokeepalive 1

ProxyPass /SOGo http://127.0.0.1:20000/SOGo retry=0 nocanon

<Proxy http://127.0.0.1:20000/SOGo>
	<IfModule headers_module>
		RequestHeader set "x-webobjects-server-port" "%{SERVER_PORT}e" env=SERVER_PORT
		SetEnvIf Host (.*) HTTP_HOST=$1
		RequestHeader set "x-webobjects-server-name" "%{HTTP_HOST}e" env=HTTP_HOST
		RequestHeader set "x-webobjects-server-url" "https://%{HTTP_HOST}e" env=HTTP_HOST

		RequestHeader unset "x-webobjects-remote-user"
		RequestHeader set "x-webobjects-server-protocol" "HTTP/1.0"
	</IfModule>
</Proxy>
