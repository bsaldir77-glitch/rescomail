<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resco Mail — Giriş</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="stil.css">
</head>
<body>
  <main class="kart">
    <img src="logo.svg" alt="Resco Mail" class="logo">

    <div id="adim-eposta">
      <p class="aciklama">E-posta adresinizi girin, telefonunuza giriş kodu gönderelim.</p>
      <label for="eposta">E-posta adresiniz</label>
      <input id="eposta" type="email" inputmode="email" autocomplete="username"
             placeholder="ornek@saldir.tr" autofocus>
      <button id="kod-btn" class="btn" type="button">Kod Gönder</button>
    </div>

    <div id="adim-kod" class="gizli">
      <p class="aciklama">Telefonunuza gelen <b>6 haneli kodu</b> girin.<br>
        <span id="maske" class="kucuk"></span></p>
      <label for="kod">Giriş kodu</label>
      <input id="kod" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="••••••">
      <button id="giris-btn" class="btn" type="button">Giriş Yap</button>
      <button id="geri-btn" class="btn duz" type="button">← Adresi değiştir</button>
    </div>

    <p id="hata" class="hata" role="alert"></p>
    <p class="alt"><a id="parola-yolu" href="#" class="gizli">Parolamla giriş yapmak istiyorum</a></p>
  </main>
  <p class="imza">Resco Mail · güvenli giriş</p>
<script src="uygulama.js"></script>
</body>
</html>
